[project]
name = "sales-agent"
version = "0.1.0"
description = "Sales call multi-turn agent"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.116",
    "fastembed>=0.8.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "openai>=2.0",
    "pgvector>=0.4",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
sales-agent-api = "sales_agent.main:run"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "integration: requires the local PostgreSQL test database",
]
